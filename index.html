<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#edf3ff">
<title>Lorens QP · Smart IR</title>
<style>
:root{
  color-scheme:light;
  --bg:#eaf1ff;
  --bg2:#f8fbff;
  --surface:#edf3ff;
  --surface-2:#f7faff;
  --text:#0b1733;
  --muted:#7f8ea8;
  --line:#d7e2f3;
  --blue:#1d73ff;
  --blue-2:#4ec2ff;
  --blue-3:#3551ff;
  --green:#25c46a;
  --oled:#03070d;
  --danger:#dc5a66;
  --shadow-dark:rgba(111,130,166,.22);
  --shadow-light:rgba(255,255,255,.96);
}
*{box-sizing:border-box}
html{background:var(--bg);height:100%;overflow:hidden}
html,body{width:100%;max-width:100%;height:100%;overflow:hidden}
body{
  margin:0;
  height:100dvh;
  min-height:100dvh;
  overflow:hidden;
  color:var(--text);
  font:500 15px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 10% 7%,rgba(78,194,255,.19),transparent 22%),
    radial-gradient(circle at 92% 24%,rgba(29,115,255,.15),transparent 24%),
    linear-gradient(180deg,#f2f7ff 0%,#e7effd 100%);
    background: #e2e9ef;
}
body:before,body:after{
  content:"";
  position:fixed;
  z-index:-1;
  border-radius:50%;
  pointer-events:none;
  border:1px solid rgba(255,255,255,.75);
  box-shadow:inset 12px 12px 30px rgba(95,122,170,.11),inset -12px -12px 28px rgba(255,255,255,.92);
}
body:before{width:250px;height:250px;left:-135px;top:-85px}
body:after{width:290px;height:290px;right:-160px;bottom:-110px}
button{font:inherit;color:inherit;cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
img{max-width:100%}
:root{--header-h:86px;--footer-h:80px}
.app-header{
  position:fixed;left:0;right:0;top:0;z-index:40;
  height:calc(var(--header-h) + env(safe-area-inset-top));
  padding:calc(10px + env(safe-area-inset-top)) 14px 8px;
  background:rgba(239,245,255,.88);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(220,229,243,.78);
}
.top{
  max-width:720px;height:100%;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.app-body{
  position:fixed;
  left:0;right:0;
  top:calc(var(--header-h) + env(safe-area-inset-top));
  bottom:calc(var(--footer-h) + env(safe-area-inset-bottom));
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  scrollbar-width:none;
  isolation:isolate;
}
.app-body::-webkit-scrollbar{width:0;height:0;display:none}
.shell{width:100%;max-width:720px;margin:0 auto;padding:10px 14px 22px}

.brand-wrap{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-mark{
  width:58px;height:58px;border-radius:20px;flex:none;position:relative;
  background:linear-gradient(145deg,#f8fbff,#dfe9f7);
  box-shadow:12px 12px 22px var(--shadow-dark),-10px -10px 20px var(--shadow-light),inset 0 0 0 1px rgba(255,255,255,.76);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.brand-mark .mini {
    font-size: 8px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    line-height: 1;
    color: #6a7a96;
    margin-bottom: 0px;
}
.brand-mark .big{
  font-size:28px;font-weight:900;line-height:.88;letter-spacing:-.09em;
  background:linear-gradient(135deg,var(--blue-3),var(--blue-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-copy{min-width:0}
.brand{font-size:20px;font-weight:900;letter-spacing:-.03em;line-height:1.02;white-space:nowrap}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.network{
  display:flex;align-items:center;justify-content:center;align-self:center;gap:7px;flex:none;
  color:#5f7899;font-size:11px;line-height:1.08;text-align:left;
  padding:9px 11px;border-radius:17px;min-height:58px;
  background:linear-gradient(145deg,#f8fbff,#e2eaf8);
  box-shadow:8px 8px 18px rgba(110,132,168,.18),-8px -8px 18px rgba(255,255,255,.92),inset 0 0 0 1px rgba(255,255,255,.7);
}
.dot{
  width:10px;height:10px;border-radius:50%;background:#97a4bb;flex:none;margin-top:1px;
  box-shadow:0 0 0 5px rgba(151,164,187,.12);
}
.dot.ok{background:var(--green);box-shadow:0 0 0 5px rgba(37,196,106,.14),0 0 16px rgba(37,196,106,.58)}
#network{white-space:normal}
.card {
    background: linear-gradient(145deg, rgb(247 250 255 / 81%), rgb(229 238 251 / 73%));
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, .76);
    padding: 18px;
    /* box-shadow: 16px 16px 34px rgba(103, 126, 164, .18), -12px -12px 28px rgba(255, 255, 255, .96), inset 0 0 0 1px rgba(216, 228, 245, .4); */
    backdrop-filter: blur(14px);
    margin: 0px 0;
}
.hero-card{padding:16px 16px 18px;position:relative;overflow:visible}

.fullscreen-btn{
  position:absolute;top:11px;right:11px;z-index:5;
  width:38px;height:38px;border-radius:14px;display:grid;place-items:center;
  color:#61789b;background:linear-gradient(145deg,#f9fbff,#dde7f6);
  box-shadow:6px 6px 13px rgba(104,127,164,.18),-6px -6px 13px rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.7);
  transition:transform .15s ease,color .15s ease,box-shadow .15s ease;
}
.fullscreen-btn svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fullscreen-btn:hover{color:var(--blue)}
.fullscreen-btn:active{transform:scale(.94);box-shadow:inset 4px 4px 9px rgba(104,127,164,.18),inset -4px -4px 9px rgba(255,255,255,.9)}

.eyebrow{
  text-align:center;font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);
}
.dial-wrap {
    width: min(281px, 88vw);
    aspect-ratio: 1;
    position: relative;
    margin: 5px auto 0px;
}
.dial-shell {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    /* background: linear-gradient(145deg, #f9fbff, #dde8f8); */
    /* box-shadow: 24px 24px 44px rgba(102, 124, 160, .24), -18px -18px 38px rgba(255, 255, 255, .98), inset 7px 7px 16px rgba(255, 255, 255, .66), inset -10px -10px 18px rgba(115, 141, 182, .14); */
}
.dial-shell:before {
    content: "";
    position: absolute;
    inset: 15px;
    border-radius: 50%;
    box-shadow: inset 10px 10px 20px rgba(109, 131, 164, .11), inset -9px -9px 18px rgba(255, 255, 255, .94), 24px 24px 44px rgba(102, 124, 160, .24), -18px -18px 38px rgba(255, 255, 255, .98), inset 7px 7px 16px rgba(255, 255, 255, .66), inset -10px -10px 18px rgba(115, 141, 182, .14), 11px 10px 31px 2px rgb(154 154 154 / 30%), -13px -8px 20px 0px rgb(255 255 255);
    border: 1px solid rgba(255, 255, 255, .92);
}
.dial{position:absolute;inset:24px;border-radius:50%;display:grid;place-items:center}
.dial svg{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);filter:drop-shadow(0 0 10px rgba(29,115,255,.18))}
.oled {
    position: relative;
    z-index: 2;
    width: 72%;
    aspect-ratio: 1;
    border-radius: 50%;
    display: grid;
    place-items: center;
    text-align: center;
    background: radial-gradient(circle at 48% 32%, rgba(27, 48, 74, .9), rgba(6, 12, 20, .98) 44%, #020306 72%), #03070d;
    border: 1px solid rgba(117, 164, 255, .16);
    box-shadow: inset 0 0 0 5px #07101a, inset 0 0 44px rgba(31, 114, 255, .10), 0 18px 34px rgba(0, 18, 50, .28), 0 0 0 1px rgba(255, 255, 255, .52), 0px 0px 0px 5px rgb(255 252 252), 8px 17px 20px 0px rgb(147 152 156);
}
.oled:after{content:"";position:absolute;inset:11px;border-radius:50%;border:1px solid rgba(71,148,255,.08);pointer-events:none}
.oled-content{position:absolute;inset:0}
.value{
  position:absolute;left:50%;top:50%;transform: translate(-45%, -59%);
  font-size:76px;font-weight:780;letter-spacing:-.085em;line-height:.9;color:#fff;white-space:nowrap;
  text-shadow:0 0 18px rgba(255,255,255,.08);
}
.value small{font-size:24px;vertical-align:top;margin-left:4px;color:#58b8ff;text-shadow:0 0 16px rgba(54,163,255,.55)}
.mode-badge{
  position:absolute;left:50%;bottom:16%;transform:translateX(-50%);
  min-width:0;min-height:0;padding:0;display:flex;align-items:center;justify-content:center;
  background:transparent;border:0;box-shadow:none;
}
.mode-glyph{font-size:22px;line-height:1;color:#66b9ff;text-shadow:0 0 12px rgba(56,154,255,.46)}
.mode-label{display:none;font-size:14px;font-weight:800;letter-spacing:.04em;color:#8b96a8}
.range-note{display:flex;justify-content:space-between;width:min(260px,72vw);margin:0px auto 0;color:#95a2b7;font-size:10px;font-weight:800;letter-spacing:.08em}
.temp-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:4px}
.circle{
  width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:600;
  background:linear-gradient(145deg,#f9fbff,#dce7f7);color:var(--blue);
  box-shadow:9px 9px 18px rgba(104,127,164,.23),-9px -9px 18px rgba(255,255,255,.96),inset 0 0 0 1px rgba(255,255,255,.66);
  transition:transform .15s ease,box-shadow .15s ease,color .15s ease;
}
.circle:hover{color:#0d59ec}
.circle:active{transform:scale(.94);box-shadow:inset 5px 5px 12px rgba(106,129,167,.22),inset -5px -5px 12px rgba(255,255,255,.92)}
.adjust-label{min-width:106px;text-align:center;color:var(--muted);font-size:12px}
.power{
  width:100%;margin-top:16px;padding:16px 24px;border-radius:20px;font-weight:850;letter-spacing:.08em;
  transition:transform .15s ease,background .18s ease,color .18s ease,box-shadow .18s ease;
}
.power:active{transform:scale(.99)}
.power.turn-on {
    color: #fff;
    background: linear-gradient(135deg, #45bcff 0%, #1d73ff 52%, #3551ff 100%);
    box-shadow: 0 14px 28px rgb(29 115 255 / 0%), inset 0 1px 0 rgba(255, 255, 255, .44), 0 0 22px rgba(62, 157, 255, .16);
}
.power.turn-off{
  color:#68768c;background:linear-gradient(145deg,#eef2f7,#d7dee8);
  box-shadow:8px 8px 17px rgba(104,118,143,.20),-8px -8px 17px rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.62);
}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.section-title h2{margin:0;font-size:18px;letter-spacing:-.02em;text-align: center;
    width: 100%;}
.modes-row {
    position: relative;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.5rem 2.5rem;
    padding: 1px 38px;
}
.mode-chip {
    min-width: 0;
    min-height: 42px;
    padding: 9px 8px;
    border-radius: 35px;
    background: linear-gradient(145deg, #f8fbff, #dfe8f8);
    color: #51637f;
        box-shadow: 6px 6px 13px rgb(111 136 174 / 34%), -6px -6px 13px rgb(255 255 255 / 0%), inset 0 0 0 1px rgb(255 255 255 / 0%);

    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 7px;
    text-align: center;
}
.mode-chip:active{transform:scale(.98)}
.mode-chip .chip-icon{font-size:19px;line-height:1;color:#6dbbff;text-shadow:0 0 12px rgba(57,153,255,.24);flex:none}
.mode-chip .chip-text{font-size:12px;font-weight:850;white-space:nowrap}
.mode-chip.active{
  background:linear-gradient(160deg,#05080e,#141b26);color:#6db7ff;
  box-shadow:0 18px 28px rgba(5,10,22,.28),inset 0 0 0 1px rgba(83,142,255,.18),0 0 18px rgba(35,117,255,.18);
}
.mode-chip.active .chip-icon{color:#7cc4ff;text-shadow:0 0 12px rgba(70,170,255,.5)}
.smallbtn,.actions button{
  background:linear-gradient(145deg,#f8fbff,#dfe9f8);border-radius:16px;padding:9px 12px;
  color:#435571;box-shadow:7px 7px 14px rgba(109,132,169,.16),-7px -7px 14px rgba(255,255,255,.94),inset 0 0 0 1px rgba(255,255,255,.66);
}
.signals{display:grid;gap:12px}
.signal{
  padding:13px 15px;border-radius:20px;background:linear-gradient(145deg,#f8fbff,#e2ebf8);
  box-shadow:7px 7px 14px rgba(111,136,174,.16),-7px -7px 14px rgba(255,255,255,.94);
}
.signal summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.signal summary::marker{content:""}
.signal strong{font-size:14px}
.signal code{font-size:11px;color:var(--blue)}
.details{padding-top:12px;color:#657691;font-size:12px;line-height:1.65;overflow-wrap:anywhere}
.raw{background:#e7eef9;padding:10px;border-radius:12px;word-break:break-word;box-shadow:inset 3px 3px 8px rgba(117,140,174,.12),inset -3px -3px 8px rgba(255,255,255,.78)}
.actions{display:flex;gap:8px;margin-top:10px}
.danger{color:var(--danger)!important}
.hidden{display:none!important}
.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  min-height:calc(var(--footer-h) + env(safe-area-inset-bottom));
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(242,247,255,.86);backdrop-filter:blur(18px);border-top:1px solid rgba(220,229,243,.92);
}
.bottom .tabs {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    padding: 6px;
    border-radius: 22px;
    /* background: linear-gradient(145deg, rgba(247, 250, 255, .96), rgba(226, 235, 248, .94)); */
    /* box-shadow: 10px 10px 22px rgba(104, 127, 164, .18), -8px -8px 18px rgba(255, 255, 255, .9); */
}
.bottom button{
  flex:1;padding:12px 10px;border-radius:24px;background:transparent;color:#7c8da6;font-size:12px;font-weight:850;
}
.bottom button.active {
    color: var(--blue);
    background: linear-gradient(145deg, #f9fbff, #dce7f7);
    box-shadow: 5px 5px 11px rgba(104, 127, 164, .16), -5px -5px 11px rgba(255, 255, 255, .92);
    background-image: url(btn_1_back.png);
    background-size: cover;
    background-repeat: no-repeat;
    color: white;
    box-shadow: 1px 1px 0px 0px rgb(217 230 243), 7px 7px 12px -6px rgb(76 137 235);
}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:94px;z-index:50;
  max-width:min(92%,460px);padding:12px 15px;border-radius:15px;
  color:#fff;background:#0a1222;box-shadow:0 15px 28px rgba(7,14,28,.26),0 0 18px rgba(29,115,255,.16);
  font-size:13px;
}
.empty-msg{color:var(--muted);font-size:13px;line-height:1.6}
@media(max-width:520px){
  :root{--header-h:74px;--footer-h:72px}
  .app-header{padding:calc(8px + env(safe-area-inset-top)) 12px 6px}
  .shell{padding:9px 12px 16px}
  .brand-mark{width:52px;height:52px;border-radius:18px}
  .brand-mark .big{font-size:24px}
  .brand{font-size:18px}
  .sub{font-size:11px}
  .network{font-size:10px;padding:8px 9px;min-height:52px}
  .card{padding:16px;border-radius:28px}
  .dial{inset:23px}
  .value{font-size:68px}
}
@media(max-width:390px){
  .top{align-items:stretch}
  .brand-wrap{gap:8px}
  .network{max-width:98px}
  .mode-chip{padding:8px 6px;gap:6px}
  .adjust-label{min-width:92px;font-size:11px}
  .circle{width:55px;height:55px}
}
/* Ajuste vertical inteligente para móviles: el contenido central se compacta
   según la altura REAL disponible entre header y footer. */
@media (max-width:520px){
  .app-body{
    container-type:size;
  }

  #home{
    min-height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:clamp(1rem, 1cqh, 10px);
  }

  #home > .card{
    flex:none;
  }

  #home .hero-card{
    padding:clamp(8px, 1.7cqh, 16px) 14px clamp(9px, 1.8cqh, 18px);
  }

  #home .dial-wrap{
    width:min(281px, 88vw, 43cqh);
    margin:clamp(1px, .7cqh, 5px) auto 0;
  }

  #home .dial{
    inset:clamp(14px, 3.6cqh, 23px);
  }

  #home .dial-shell:before{
    inset:clamp(9px, 2.2cqh, 15px);
  }

  #home .value{
    font-size:clamp(46px, 10cqh, 68px);
  }

  #home .value small{
    font-size:clamp(17px, 3.6cqh, 24px);
  }

  #home .mode-glyph{
    font-size:clamp(16px, 3.2cqh, 22px);
  }

  #home .range-note{
    width:min(260px,72vw,40cqh);
    font-size:clamp(8px, 1.6cqh, 10px);
  }

  #home .temp-row{
    gap:clamp(8px, 2cqh, 14px);
    margin-top:clamp(1px, .7cqh, 4px);
  }

  #home .circle{
    width:clamp(42px, 8.5cqh, 58px);
    height:clamp(42px, 8.5cqh, 58px);
    font-size:clamp(22px, 4cqh, 28px);
  }

  #home .adjust-label{
    min-width:clamp(82px, 17cqh, 106px);
    font-size:clamp(10px, 1.9cqh, 12px);
  }

  #home .power{
    margin-top:clamp(6px, 1.6cqh, 16px);
    padding:clamp(10px, 2.2cqh, 16px) 20px;
    border-radius:clamp(15px, 2.8cqh, 20px);
  }

  #home > .card + .card{
    margin-top:0 !important;
    padding:clamp(12px, .8cqh, 5px) 14px !important;
  }

  #home .section-title{
    margin-bottom:clamp(3px, .8cqh, 10px);
  }

  #home .section-title h2{
    font-size:clamp(14px, 2.7cqh, 18px);
  }

  #home .modes-row{
    gap:clamp(4px, 1cqh, 8px) clamp(14px, 4vw, 40px);
    padding:1px clamp(12px, 7vw, 38px);
  }

  #home .mode-chip{
    min-height:clamp(34px, 6.5cqh, 42px);
    padding:clamp(5px, 1.3cqh, 9px) 7px;
  }

  #home .mode-chip .chip-icon{
    font-size:clamp(15px, 3cqh, 19px);
  }

  #home .mode-chip .chip-text{
    font-size:clamp(10px, 1.9cqh, 12px);
  }
}

/* Fallback para navegadores sin unidades de container query. */
@supports not (width: 1cqh){
  @media (max-width:520px){
    #home .dial-wrap{width:min(281px,88vw,34dvh)}
  }
}

/* En móviles especialmente bajos, apretamos un poco más sin tocar header/footer. */
@media (max-width:520px) and (max-height:700px){
  .shell{padding-top:5px;padding-bottom:5px}
  #home{gap:0.7rem}
  #home .fullscreen-btn{width:34px;height:34px;border-radius:12px;top:8px;right:8px}
  #home .eyebrow{font-size:9px}
}

@media (max-width:520px) and (max-height:620px){
  #home .dial-wrap{width:min(88vw,38cqh)}
  #home .power{font-size:13px}
  #home .modes-row{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:1px 4px}
  #home .mode-chip{border-radius:24px;gap:4px}
  #home .mode-chip .chip-text{font-size:9px}
}

</style>
</head>
<body>
<header class="app-header">
  <div class="top">
    <div class="brand-wrap">
      <div class="brand-mark" aria-label="Lorens QP">
        <span class="mini">Lorens</span>
        <span class="big">QP</span>
      </div>
      <div class="brand-copy">
        <div class="brand">Lorens QP</div>
        <div class="sub">Smart IR</div>
      </div>
    </div>
    <div class="network" aria-live="polite">
      <span id="dot" class="dot ok"></span>
      <span id="network">Conectado a <br>Firebase</span>
    </div>
  </div>
</header>

<main class="app-body" id="appBody">
  <div class="shell">
  <section id="home">
    <div class="card hero-card">
      <button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="Pantalla completa" title="Pantalla completa">
        <svg id="fullscreenIcon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>
        </svg>
      </button>
      <div class="eyebrow">Termostato · Aire 1</div>
      <div class="dial-wrap">
        <div class="dial-shell"></div>
        <div class="dial">
          <svg id="gauge" viewBox="0 0 320 320" aria-hidden="true"></svg>
          <div class="oled">
            <div class="oled-content">
              <div class="value" id="value">22<small>°C</small></div>
              <div class="mode-badge" id="modeBadge">
                <span class="mode-glyph" id="modeGlyph">❄</span>
                <span class="mode-label" id="modeLabel">Frío</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="range-note"><span>16°</span><span>30°</span></div>
      <div class="temp-row">
        <button class="circle" id="minus" aria-label="Bajar temperatura">−</button>
        <span class="adjust-label">Ajustar temperatura</span>
        <button class="circle" id="plus" aria-label="Subir temperatura">+</button>
      </div>
      <button class="power turn-on" id="power">ENCENDER</button>
    </div>

    <div class="card" style="margin-top: 10px;padding: 5px 14px;">
      <div class="section-title"><h2>Modos</h2></div>
      <div class="modes-row" id="controls"></div>
    </div>
  </section>

  <section id="library" class="hidden">
    <div class="card">
      <div class="section-title"><h2>Señales IR</h2><button class="smallbtn" id="refresh">Actualizar</button></div>
      <p class="empty-msg">Aquí puedes consultar, probar o eliminar las señales IR clonadas desde el equipo.</p>
      <div class="signals" id="signals"></div>
    </div>
  </section>
  </div>
</main>

<nav class="bottom" aria-label="Navegación principal">
  <div class="tabs">
    <button data-page="home" class="active">Termostato</button>
    <button data-page="library">Señales IR</button>
  </div>
</nav>
<div id="toast" class="hidden" role="status"></div>

<script>
'use strict';
const API='https://firestore.googleapis.com/v1/projects/facturacion-drink/databases/(default)/documents/devices/neger-thermostat-01';
const TEST_DOC='https://firestore.googleapis.com/v1/projects/facturacion-drink/databases/(default)/documents/devices/test';
const TEST_COLLECTION='https://firestore.googleapis.com/v1/projects/facturacion-drink/databases/(default)/documents/devices';
const KEY='AIzaSyCa3ntHg9DqV3JefcvFP9cg8xCmwm0wlLo';
const names=['Encender','Apagar','Frío','Deshumidificar','Ventilador','Auto','Fan auto','Fan bajo','Fan alto','Swing','Sleep','Turbo'];
const MODES={
  cool:{label:'Frío',glyph:'❄',remote:'f02'},
  dry:{label:'Deshumidificar',glyph:'💧',remote:'f03'},
  fan:{label:'Ventilador',glyph:'🌀',remote:'f04'},
  auto:{label:'Auto',glyph:'A',remote:'f05'}
};
let signals=new Map(),target=22,power=false,currentMode='cool',toastTimer;
const $=id=>document.getElementById(id);
function haptic(duration=16){
  try{if('vibrate' in navigator)navigator.vibrate(duration)}catch(_){}
}
function fullscreenElement(){return document.fullscreenElement||document.webkitFullscreenElement||null}
async function toggleFullscreen(){
  haptic(22);
  try{
    if(!fullscreenElement()){
      const root=document.documentElement;
      if(root.requestFullscreen)await root.requestFullscreen({navigationUI:'hide'});
      else if(root.webkitRequestFullscreen)root.webkitRequestFullscreen();
    }else{
      if(document.exitFullscreen)await document.exitFullscreen();
      else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
    }
  }catch(_){/* El navegador puede bloquear fullscreen si no lo admite. */}
  updateFullscreenButton();
}
function updateFullscreenButton(){
  const btn=$('fullscreenBtn');
  const icon=$('fullscreenIcon');
  if(!btn||!icon)return;
  const active=!!fullscreenElement();
  btn.setAttribute('aria-label',active?'Salir de pantalla completa':'Pantalla completa');
  btn.title=active?'Salir de pantalla completa':'Pantalla completa';
  icon.innerHTML=active
    ? '<path d=\"M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6\"/>'
    : '<path d=\"M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5\"/>';
}
function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function url(path){return API+path+(path.includes('?')?'&':'?')+'key='+encodeURIComponent(KEY)}
async function request(path,method='GET',body){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);try{const response=await fetch(url(path),{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:controller.signal});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error?.message||('HTTP '+response.status));return data}finally{clearTimeout(timer)}}
function fields(d){const o={};for(const [k,v] of Object.entries(d?.fields||{}))o[k]=v.stringValue??v.integerValue??v.booleanValue??(v.arrayValue?.values?.map(a=>Number(a.integerValue))||null);return o}
function safeText(el,txt){el.textContent=txt;return el}
function shortKey(id){return id.startsWith('f')&&id.length===3?names[Number(id.slice(1))]||id:`${id.slice(1)} °C`}
function showNetwork(ok=true){$('dot').classList.toggle('ok',ok);$('network').innerHTML=ok?'Conectado a <br>Firebase':'Sin acceso a <br>Firebase'}
function renderGauge(){
  const svg=$('gauge');if(!svg)return;
  const NS='http://www.w3.org/2000/svg';svg.replaceChildren();
  const min=16,max=30;const safe=Math.max(min,Math.min(max,target));const active=(safe-min)/(max-min);
  const total=56,start=-140,sweep=280;
  for(let i=0;i<=total;i++){
    const progress=i/total;const angle=(start+progress*sweep)*Math.PI/180;const major=i%4===0;
    const a=major?134:138,b=major?154:149;
    const line=document.createElementNS(NS,'line');
    line.setAttribute('x1',160+Math.sin(angle)*a);
    line.setAttribute('y1',160-Math.cos(angle)*a);
    line.setAttribute('x2',160+Math.sin(angle)*b);
    line.setAttribute('y2',160-Math.cos(angle)*b);
    const isActive=progress<=active+0.0001;
    line.setAttribute('stroke',isActive?'#2e96ff':'#c8d5e8');
    line.setAttribute('stroke-width',isActive?(major?5:3.2):(major?4:2.4));
    line.setAttribute('stroke-linecap','round');
    if(isActive)line.setAttribute('style','filter:drop-shadow(0 0 6px rgba(50,146,255,.95))');
    svg.append(line);
  }
}
function render(){
  renderGauge();
  $('value').innerHTML='';$('value').append(document.createTextNode(target));
  const degree=document.createElement('small');degree.textContent='°C';$('value').append(degree);
  const mode=MODES[currentMode]||MODES.cool;
  if(power){
    $('modeGlyph').textContent=mode.glyph;
    $('modeGlyph').style.display='inline';
    $('modeLabel').style.display='none';
  }else{
    $('modeGlyph').textContent='';
    $('modeGlyph').style.display='none';
    $('modeLabel').textContent='Off';
    $('modeLabel').style.display='inline';
    $('modeLabel').style.color='#8b96a8';
  }
  $('power').textContent=power?'APAGAR':'ENCENDER';
  $('power').classList.toggle('turn-off',power);
  $('power').classList.toggle('turn-on',!power);
  const controls=$('controls');controls.replaceChildren();
  for(const [key,modeData] of Object.entries(MODES)){
    const button=document.createElement('button');button.className='mode-chip'+(currentMode===key?' active':'');
    button.innerHTML=`<span class="chip-icon">${modeData.glyph}</span><span class="chip-text">${modeData.label}</span>`;
    button.onclick=()=>setMode(key);
    controls.append(button);
  }
  const library=$('signals');library.replaceChildren();
  for(const [key,s] of [...signals].sort((a,b)=>a[0].localeCompare(b[0]))){
    const box=document.createElement('details');box.className='signal';
    const summary=document.createElement('summary');
    const title=document.createElement('strong');title.textContent=shortKey(key);
    const code=document.createElement('code');code.textContent=key;
    summary.append(title,code);box.append(summary);
    const body=document.createElement('div');body.className='details';
    body.append(document.createTextNode(`Protocolo: ${s.protocol??'desconocido'} · Dirección: ${s.address??'?'} · Comando: ${s.command??'?'} · Bits: ${s.bits??'?'} · Portadora TX: ${s.carrierKhz??38} kHz · Repeticiones: ${s.copies??1} · Duraciones RAW: ${s.rawLength??s.rawTicks?.length??0}`));
    const raw=document.createElement('div');raw.className='raw';let timings=s.rawTicks||[];
    if(s.rawBase64){try{timings=Array.from(atob(s.rawBase64),c=>c.charCodeAt(0))}catch(_){timings=[]}}
    raw.textContent='RAW ('+timings.length+' bytes): '+timings.join(', ');body.append(raw);
    const actions=document.createElement('div');actions.className='actions';
    const test=document.createElement('button');test.textContent='Enviar';test.onclick=()=>saveTestState('signal:'+key);
    const del=document.createElement('button');del.className='danger';del.textContent='Eliminar';
    del.onclick=async()=>{if(confirm('¿Eliminar la señal '+shortKey(key)+' del dispositivo y Firestore?'))await saveTestState('delete-signal:'+key)};
    actions.append(test,del);body.append(actions);box.append(body);library.append(box);
  }
  if(!signals.size)library.innerHTML='<div class="empty-msg">Todavía no hay señales guardadas. La app igual responde visualmente aunque aún no existan comandos IR clonados.</div>';
}
async function loadState(){
  // Primero conserva/restaura el último estado local para que la UI no "salte" si Firebase tarda.
  try{
    const cached=JSON.parse(localStorage.getItem('lorensQP-test-state')||'null');
    if(cached){
      if(typeof cached.power==='boolean')power=cached.power;
      if(Number.isFinite(Number(cached.targetTemp)))target=Math.max(16,Math.min(30,Number(cached.targetTemp)));
      if(MODES[cached.mode])currentMode=cached.mode;
      render();
    }
  }catch(_){}
  try{
    const response=await fetch(TEST_DOC+'?key='+encodeURIComponent(KEY),{cache:'no-store'});
    const snapshot=await response.json().catch(()=>({}));
    if(!response.ok)throw Error(snapshot.error?.message||('HTTP '+response.status));
    const state=fields(snapshot);
    if(typeof state.power==='boolean')power=state.power;
    if(Number.isFinite(Number(state.targetTemp)))target=Math.max(16,Math.min(30,Number(state.targetTemp)));
    if(MODES[state.mode])currentMode=state.mode;
    persistLocalState();
    render();showNetwork(true);
  }catch(e){
    // El documento "test" puede no existir todavía. La UI sigue funcionando y se creará al primer cambio.
    render();showNetwork(false);
  }
}
async function loadSignals(){
  try{
    let docs=[],page='';
    do{const result=await request('/signals?pageSize=100'+(page?'&pageToken='+encodeURIComponent(page):''));docs.push(...(result.documents||[]));page=result.nextPageToken||''}while(page);
    signals=new Map(docs.map(d=>[d.name.split('/').pop(),fields(d)]));
    render();showNetwork(true);
  }catch(e){signals=new Map();render();showNetwork(false)}
}
function persistLocalState(){
  try{localStorage.setItem('lorensQP-test-state',JSON.stringify({power,targetTemp:target,mode:currentMode}))}catch(_){}
}
function firestoreFields(extra={}){
  const mode=MODES[currentMode]||MODES.cool;
  const values={
    power:{booleanValue:power},
    targetTemp:{integerValue:String(target)},
    unit:{stringValue:'C'},
    mode:{stringValue:currentMode},
    modeLabel:{stringValue:mode.label},
    updatedAt:{timestampValue:new Date().toISOString()},
    ...extra
  };
  return {fields:values};
}
async function saveTestState(action){
  persistLocalState();
  try{
    const payload=firestoreFields({lastAction:{stringValue:action}});
    let response=await fetch(TEST_DOC+'?key='+encodeURIComponent(KEY),{
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    let data=await response.json().catch(()=>({}));
    // Si el documento de prueba todavía no existe, créalo explícitamente como /devices/test.
    if(response.status===404){
      response=await fetch(TEST_COLLECTION+'?documentId=test&key='+encodeURIComponent(KEY),{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
      data=await response.json().catch(()=>({}));
    }
    if(!response.ok)throw Error(data.error?.message||('HTTP '+response.status));
    showNetwork(true);
    return true;
  }catch(e){
    showNetwork(false);
    return false;
  }
}
function setMode(modeKey){
  if(!MODES[modeKey])return;
  currentMode=modeKey;
  power=true;
  render();
  saveTestState('mode:'+modeKey);
}
function changeTemp(delta){
  const next=Math.max(16,Math.min(30,target+delta));
  if(next===target)return;
  target=next;
  render();
  saveTestState('temperature:'+next);
}
$('power').onclick=()=>{
  power=!power;
  render();
  saveTestState(power?'power:on':'power:off');
};
$('minus').onclick=()=>changeTemp(-1);
$('plus').onclick=()=>changeTemp(1);
$('refresh').onclick=()=>loadSignals();
document.querySelectorAll('[data-page]').forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===btn));
  $('home').classList.toggle('hidden',btn.dataset.page!=='home');
  $('library').classList.toggle('hidden',btn.dataset.page!=='library');
  const body=$('appBody');if(body)body.scrollTo({top:0,behavior:'smooth'});
});
$('fullscreenBtn').addEventListener('click',toggleFullscreen);
document.addEventListener('fullscreenchange',updateFullscreenButton);
document.addEventListener('webkitfullscreenchange',updateFullscreenButton);
// Vibración táctil corta para todos los botones, incluidos los creados dinámicamente.
document.addEventListener('pointerdown',event=>{
  const button=event.target.closest('button');
  if(button&&!button.disabled&&button.id!=='fullscreenBtn')haptic(14);
},{passive:true});
updateFullscreenButton();
render();
loadState();
loadSignals();
setInterval(()=>{if(!document.hidden)loadState()},12000);
setInterval(()=>{if(!document.hidden)loadSignals()},25000);
</script>
</body>
</html>
