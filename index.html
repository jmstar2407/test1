<!doctype html>
<html lang="es-DO">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <title>ArríbaTe · Propiedades en República Dominicana</title>
 <meta name="description" content="Encuentra casas, apartamentos, solares y más en venta o alquiler en República Dominicana. Explora el mapa y publica tu propiedad en ArríbaTe.">
 <meta name="theme-color" content="#145d52"><link rel="icon" href="img/favicon.svg" type="image/svg+xml">
 <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
 <a class="skip-link" href="#results">Saltar a las propiedades</a>
 <header class="site-header">
  <a class="brand" href="index.html" aria-label="ArríbaTe inicio"><span class="brand-mark" aria-hidden="true">A↑</span>ArríbaTe<span class="brand-dot">.</span></a>
  <nav aria-label="Navegación principal"><button data-operation="sale" class="nav-button active">Comprar</button><button data-operation="rent" class="nav-button">Alquilar</button></nav>
  <div class="account-controls"><button id="my-properties" class="nav-button">Mis propiedades</button><button id="auth-button" class="secondary">Iniciar sesión</button><button id="publish" class="primary">PublícaTe <span aria-hidden="true">＋</span></button></div>
 </header>
 <main>
  <section class="explore-toolbar" aria-label="Buscar propiedades">
   <form id="search-form" class="search-bar" role="search"><span aria-hidden="true">⌕</span><input id="search-input" type="search" maxlength="180" placeholder="Sector, municipio, provincia…" aria-label="Buscar ubicación, tipo o precio" list="places"><datalist id="places"></datalist><button class="search-submit" aria-label="Buscar" type="submit">Buscar</button></form>
   <button id="filters-button" class="secondary filter-button"><span aria-hidden="true">☷</span> Filtros <span id="filter-count" hidden></span></button>
  </section>
  <div class="workspace">
   <aside class="results-pane" id="results" tabindex="-1" aria-label="Resultados de propiedades">
    <button id="mobile-account" class="mobile-account secondary">Mis propiedades</button><div class="results-heading"><h2 id="results-title">Explora propiedades</h2><button id="refresh" class="icon-button" aria-label="Actualizar resultados">↻</button></div>
    <p id="status" class="status" role="status" aria-live="polite">Cargando…</p>
    <div id="active-filters" class="tags"></div><div id="property-list" class="property-list"></div>
    <button id="load-more" class="secondary load-more" hidden>Buscar más en esta zona</button>
   </aside>
   <section class="map-section" aria-label="Mapa de propiedades">
    <div id="map" role="region" aria-label="Mapa interactivo de República Dominicana"></div>
    <div class="map-top-controls"><span class="map-caption">Explora República Dominicana</span><button id="locate" class="map-control" aria-label="Ir a mi ubicación">◎</button></div>
    <div id="map-error" class="map-error" hidden>El mapa no pudo cargar. Puedes seguir buscando en la lista.</div>
    <div class="map-style-control" role="group" aria-label="Estilo del mapa"><button id="map-style" class="active" aria-pressed="true">Mapa</button><button id="satellite-style" aria-pressed="false">Satélite</button></div>
    <div class="map-legend"><span><i style="--pin:#d63c46"></i>Casa</span><span><i style="--pin:#2670d9"></i>Apartamento</span><span><i style="--pin:#188449"></i>Terreno</span><button id="legend-button" aria-label="Ver todos los tipos de marcadores">＋</button></div>
   </section>
  </div>
  <button id="mobile-view" class="mobile-view primary">Ver lista</button>
 </main>
 <template id="legal-footer"><footer class="site-footer"><div><a class="brand" href="index.html">ArríbaTe<span class="brand-dot">.</span></a><p>© ArríbaTe 2024</p></div><div class="footer-copy"><p>ArríbaTe se compromete a garantizar la accesibilidad digital para personas con discapacidades. Trabajamos continuamente para mejorar la accesibilidad de nuestra experiencia web para todos.</p><p>Aviso: La información presentada es de carácter informativo y está sujeta a cambios sin previo aviso. Al utilizar nuestra plataforma, reconoces y aceptas cumplir con nuestras Condiciones de uso y Políticas de privacidad.</p><div class="footer-links"><button data-legal="privacy" class="text-button">Políticas de privacidad</button><button data-legal="terms" class="text-button">Condiciones de uso</button><span>Síguenos</span><div class="social-links"></div></div></div></footer></template>
 <div id="toast" role="alert" hidden></div><noscript><p>Activa JavaScript para explorar el mapa y las propiedades de ArríbaTe.</p></noscript>
 <script src="js/base.js" defer></script>
 <script src="js/firebase.js" defer></script>
 <script src="js/mapa.js" defer></script>
 <script src="js/interfaz.js" defer></script>
 <script src="js/app.js" defer></script>
</body></html>
